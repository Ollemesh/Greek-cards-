name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Build
        env:
          # Set CARDS_URL variable in GitHub repo settings → Variables
          # Example: https://raw.githubusercontent.com/YOUR_USERNAME/greek-cards-data/main/cards.json
          PUBLIC_CARDS_URL: ${{ vars.CARDS_URL || '/cards.json' }}
          PUBLIC_PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL || 'https://greek-push-worker.ollemesh.workers.dev' }}
          # Set BASE_PATH if your repo is not at root (e.g. /greek-cards)
          BASE_PATH: ${{ vars.BASE_PATH || '' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
